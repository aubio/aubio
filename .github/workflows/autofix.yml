name: autofix.ci # must be exactly this: autofix.ci identifies the workflow by name

on:
  pull_request:

permissions:
  contents: read

# A new push makes the running fix obsolete.
concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix:
    uses: LedFx/.github/.github/workflows/autofix.yml@ca0fe21917a0ea7b7cbf6b065139f22be7561e12 # main
