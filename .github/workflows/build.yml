# Lint, test, build and publish aubio-ledfx.
#
# Pull requests and main: lint gate, C test suite, sdist and portable wheels
# for every platform (cibuildwheel runs the Python test suite against each
# wheel). A v* tag (pushed by release-please.yml when its release PR merges)
# also publishes: PyPI through Trusted Publishing behind the pypi
# environment, then the wheels are attached to release-please's draft GitHub
# release, which is published.
#
# The file keeps its historical name: PyPI's trusted publisher is bound to
# `build.yml`. The workflow is named "CI" because lint-notify.yml looks it up
# by that name.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Weekly on main: GitHub evicts caches unused for 7 days, and pull requests
  # restore main's, so this keeps the vcpkg binary caches warm. It also
  # catches runner image and dependency changes before a release does.
  schedule:
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main or tag runs: tag runs publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides what a run builds, here rather than with paths filters: a workflow
  # skipped by a filter never reports, so the required "CI passed" check would
  # wait forever, and skipped jobs count as passed. Also checks that the tag,
  # pyproject.toml, meson.build, VERSION and vcpkg.json agree on the version.
  #
  # Pushes (main, tags), the weekly run and manual runs build everything. A pull
  # request builds what its changed files can affect:
  # - prose, docs, other workflows, bot config: lint only;
  # - one platform's pyproject.toml [tool.cibuildwheel.<platform>] table, its
  #   vcpkg triplets or its platform-only sources: that platform's wheels;
  # - Python bindings and tests: every wheel (the tests run inside each wheel
  #   build, against that platform's backends);
  # - the C library, its tests, meson.build: the C tests and every wheel
  #   (meson.build is one file for every platform, so any change builds all);
  # - this workflow, or anything not classified here: everything.
  # Stacked pull requests: one with another open PR on top of it builds only
  # Linux x86_64 (its tree is tested in full by the top of the stack); the top
  # of a stack (based on another PR's branch) builds everything.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # lists the PR's changed files and stacked PRs
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      version_only: ${{ steps.version_scope.outputs.version-only == 'true' && steps.abi_scope.outputs.abi-changed == 'false' }}
      matrix: ${{ steps.wheels.outputs.matrix }}
      wheel-plan: ${{ steps.wheels.outputs.wheel-plan }}
      c-tests: ${{ steps.plan.outputs.c-tests }}
      wheels: ${{ steps.plan.outputs.wheels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # version-scope diffs PRs against origin/main: merge refs carry no
          # parents without full history.
          fetch-depth: 0
          sparse-checkout: |
            pyproject.toml
            uv.lock
            meson.build
            VERSION
            vcpkg.json
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - id: wheels
        uses: LedFx/release-ci/actions/plan@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
      # A release-please PR bumps the version in five files plus the changelog
      # and manifest; no compiled artifact can differ. Renovate dependency or
      # lock changes leave other lines behind and still build everything.
      - id: version_scope
        uses: LedFx/release-ci/actions/version-scope@12ea4ced7288cb6b0f3a8aafbac3e825969c17ca # v0.4.2
        with:
          package-name: aubio-ledfx
          versioned-manifests: |
            pyproject.toml
            uv.lock
            meson.build
            vcpkg.json
          simple-version-files: |
            VERSION
      # VERSION also holds the libtool ABI numbers meson.build builds with; a
      # change to those is a build change, never release metadata. Compare
      # commits, not the sparse working tree, and build when unsure.
      - id: abi_scope
        if: steps.version_scope.outputs.version-only == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range=(origin/main...HEAD) ;;
            *) range=("$BEFORE" HEAD) ;;
          esac
          changed=true
          if [[ "$EVENT" == pull_request || ( -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ) ]] &&
             diff="$(git diff "${range[@]}" -- VERSION)"; then
            if ! grep -qE '^[-+]LIBAUBIO_LT_' <<<"$diff"; then
              changed=false
            fi
          fi
          echo "abi-changed=$changed" >> "$GITHUB_OUTPUT"

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          WHEEL_MATRIX: ${{ steps.wheels.outputs.matrix }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          # PR-controlled on PR runs; it ends up in outputs and release names.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.+-]*)$ ]]; then
            echo "::error::Unexpected version string in pyproject.toml"
            exit 1
          fi
          meson=$(sed -nE "s/^  version: '([^']+)'.*/\1/p" meson.build)
          vcpkg=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['version-string'])")
          # shellcheck disable=SC1091
          file=$(. ./VERSION && echo "$AUBIO_MAJOR_VERSION.$AUBIO_MINOR_VERSION.$AUBIO_PATCH_VERSION$AUBIO_VERSION_STATUS")
          for other in "$meson" "$vcpkg" "$file"; do
            if [[ "$other" != "$version" ]]; then
              echo "::error::Version mismatch: pyproject.toml $version, meson.build $meson, vcpkg.json $vcpkg, VERSION $file"
              exit 1
            fi
          done
          # The one guard for every publish path.
          if [[ "$REF" == refs/tags/v* && "$REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag ${REF#refs/tags/} does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == push && "$REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

          c_tests=true linux=true windows=true macos=true
          if [ -n "$PR" ]; then
            c_tests=false linux=false windows=false macos=false
            build_all() { c_tests=true linux=true windows=true macos=true; }
            build_wheels() { linux=true windows=true macos=true; }
            # previous_filename: a rename out of a path still changes that path
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            while IFS= read -r f; do
              case "$f" in
                "") ;;
                .github/workflows/build.yml) build_all ;;
                # linted, nothing to build
                .github/*|doc/*|SECURITY/*|scripts/apple/*|scripts/build_apple_frameworks \
                  |*.md|*.rst|ChangeLog|AUTHORS|COPYING|renovate.json|release-please-config.json \
                  |.release-please-manifest.json|.pre-commit-config.yaml|.gitignore|python/demos/*) ;;
                src/io/audio_unit.[ch]|src/io/*_apple_audio.[ch]|tests/src/io/test-*_apple_audio.c) macos=true ;;
                src/utils/windll.c) windows=true ;;
                vcpkg-triplets/*-linux-*.cmake) linux=true ;;
                pyproject.toml)
                  # Only the [tool.cibuildwheel.<platform>] tables that changed,
                  # unless anything else that builds did.
                  gh api -H "Accept: application/vnd.github.raw" \
                    "repos/$REPO/contents/pyproject.toml?ref=$BASE_SHA" < /dev/null > "$RUNNER_TEMP/base.toml" || : > "$RUNNER_TEMP/base.toml"
                  changed=$(python3 - "$RUNNER_TEMP/base.toml" <<'PY'
          import copy, sys, tomllib
          def split(path):
              try:
                  with open(path, "rb") as f:
                      d = tomllib.load(f)
              except (OSError, tomllib.TOMLDecodeError):
                  return None, None
              d = copy.deepcopy(d)
              tool = d.get("tool", {})
              tool.pop("ruff", None)  # lint config
              cibw = tool.get("cibuildwheel", {})
              return {p: cibw.pop(p, None) for p in ("linux", "windows", "macos")}, d
          old, old_rest = split(sys.argv[1])
          new, new_rest = split("pyproject.toml")
          if old is None or old_rest != new_rest:
              print("all")
          else:
              print(" ".join(p for p in old if old[p] != new[p]))
          PY
                  )
                  for c in $changed; do
                    case "$c" in
                      all) build_all ;;
                      linux) linux=true ;;
                      windows) windows=true ;;
                      macos) macos=true ;;
                    esac
                  done
                  ;;
                python/*|vcpkg.json|vcpkg-ports/*|vcpkg-triplets/*|MANIFEST.in) build_wheels ;;
                *) build_all ;; # the C library, its tests, meson.build, anything new
              esac
            done <<< "$files"
            # Mid-stack (another open PR here builds on this branch): Linux
            # x86_64 only. A plain assignment, so a failed query fails this
            # step (bash -e) and with it CI passed.
            above=0
            if [ "$HEAD_REPO" = "$REPO" ]; then
              above=$(gh api -X GET "repos/$REPO/pulls" -f state=open -f base="$HEAD_REF" --jq length)
            fi
            if [ "$above" != 0 ]; then
              windows=false macos=false
            elif [ "$BASE_REF" != main ]; then
              build_all # top of a stack: its tree is the whole stack's
            fi
          fi

          # Every wheel job; the plan keeps those of the selected platforms.
          # On a mid-stack PR Linux means x86_64 only.
          wheels=$(jq -c --argjson linux "$linux" --argjson windows "$windows" --argjson macos "$macos" \
            --arg midstack "${above:-0}" '
            map(select(
              (.platform == "linux" and $linux and ($midstack == "0" or .arch == "x86_64"))
              or (.platform == "windows" and $windows)
              or (.platform == "macos" and $macos)))' <<< "$(jq -c '.include' <<< "$WHEEL_MATRIX")"
          )
          {
            echo "c-tests=$c_tests"
            echo "wheels=$wheels"
          } >> "$GITHUB_OUTPUT"
          echo "C tests: $c_tests; wheels: $(jq -r 'map(.runner + " " + .arch) | join(", ")' <<< "$wheels")" >> "$GITHUB_STEP_SUMMARY"

  # Fast lint gate before any build spend. Same hook set as `uvx prek run
  # --all-files` locally. autofix.ci runs in parallel and pushes fixes; that
  # push re-triggers this workflow. Failure comments come from lint-notify.yml.
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"
          extra-args: --all-files # the action adds --show-diff-on-failure itself
      - name: Shared publication wiring contracts
        run: python3 ci/test_shared_release.py

  # The C library and its own test programs, against system libraries.
  c-tests:
    name: C tests (${{ matrix.name }})
    needs: [plan, lint]
    if: needs.plan.outputs.c-tests == 'true' && needs.plan.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            setup: -Dbuildtype=release
          - name: double precision
            setup: -Dbuildtype=release -Ddouble=true
          # FFTW is off by default (ooura measured as fast at aubio's usual
          # power-of-two sizes); keep the opt-in backend building and passing
          - name: fftw3f
            setup: -Dbuildtype=release -Dfftw3f=enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libsndfile1-dev libsamplerate0-dev libfftw3-dev \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build and test
        env:
          SETUP: ${{ matrix.setup }}
        run: |
          uv venv -q --python 3.12
          uv pip install -q "meson>=1.9.0" ninja numpy
          # shellcheck disable=SC2086
          uv run --no-project meson setup builddir -Dtests=true -Dpython=false $SETUP
          uv run --no-project meson compile -C builddir
          uv run --no-project meson test -C builddir --print-errorlogs

  build-sdist:
    name: Build source distribution
    needs: [plan, lint]
    if: needs.plan.outputs.wheels != '[]' && needs.plan.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv build --sdist --python 3.12
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Wheels (${{ matrix.runner }} ${{ matrix.arch }})
    needs: [plan, lint]
    if: needs.plan.outputs.wheels != '[]' && needs.plan.outputs.version_only != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.wheels) }} # listed in the plan job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # vcpkg at the commit vcpkg.json pins (builtin-baseline), not the
      # runner image's copy, so every platform builds the same port versions.
      # Its binary cache keeps one archive per package, keyed by the package's
      # ABI hash: a warm run only unpacks archives, and a vcpkg.json change
      # rebuilds just the packages it affects. On Linux the dependencies are
      # built inside the manylinux container, which sees the host at /host.
      - name: Set up vcpkg
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "VCPKG_BINARY_SOURCES=clear;files,/host$RUNNER_TEMP/vcpkg-cache,readwrite" >> "$GITHUB_ENV"
            exit 0 # the container clones vcpkg itself (pyproject.toml before-all)
          fi
          git clone --quiet --filter=tree:0 --no-checkout https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --quiet "$baseline"
          if [[ "$RUNNER_OS" == Windows ]]; then
            cmd //c "$RUNNER_TEMP\\vcpkg\\bootstrap-vcpkg.bat" -disableMetrics
          else
            "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          {
            echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg"
            echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite"
          } >> "$GITHUB_ENV"

      - name: Cache vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-bin-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/*.cmake', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-bin-${{ matrix.runner }}-${{ matrix.arch }}-
          lookup-only: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning] release builds never restore

      # Windows: meson finds the vcpkg DLLs through vcpkg's own pkgconf (the
      # pkg-config on the image's PATH is Strawberry Perl's, which meson
      # rejects), and delvewheel bundles msvcp140.dll from this Visual Studio,
      # the toolset vcpkg builds rubberband and sleef with.
      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\vcpkg_installed\x64-windows-release"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter msvcp140.dll |
            Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC\d+\.CRT\\' } |
            Sort-Object { $_.VersionInfo.FileVersionRaw } | Select-Object -Last 1
          if (-not $crt) { throw "No x64 msvcp140.dll in $vs\VC\Redist\MSVC" }
          Write-Output "Bundling $($crt.FullName) ($($crt.VersionInfo.FileVersionRaw))"
          @(
            "PKG_CONFIG=$prefix\tools\pkgconf\pkgconf.exe"
            "PKG_CONFIG_PATH=$prefix\lib\pkgconfig"
            "CMAKE_PREFIX_PATH=$prefix"
            "MSVC_CRT_DIR=$($crt.DirectoryName)"
          ) | Add-Content $env:GITHUB_ENV

      # macOS: build the vcpkg dependencies with the wheel's deployment target,
      # with static release-only triplets.
      - name: Install vcpkg dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          TRIPLET: ${{ matrix.triplet }}
          DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          brew install nasm
          export MACOSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET"
          "$VCPKG_ROOT/vcpkg" install --triplet="$TRIPLET"
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET"
            echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET"
            echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET/lib/pkgconfig:$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET/share/pkgconfig"
          } >> "$GITHUB_ENV"

      # Everything else is in pyproject.toml [tool.cibuildwheel].
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Build and test wheels
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: >-
          uv run --frozen --only-group wheel-build python -m cibuildwheel .
          --config-file pyproject.toml --platform "$PLATFORM" --archs "$ARCH"
          --output-dir wheelhouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          compression-level: 0 # wheels are already zip files

  # The one check to require in branch protection: skipped jobs count as
  # passed, so this fails explicitly when anything it needs did not succeed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [plan, lint, c-tests, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A job the plan skipped is "skipped", which passes; anything that ran
      # must have succeeded. Outside a version-only release bump, a job the
      # plan selected must actually have run.
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          VERSION_ONLY: ${{ needs.plan.outputs.version_only }}
          C_TESTS: ${{ needs.plan.outputs.c-tests }}
          WHEELS: ${{ needs.plan.outputs.wheels }}
          C_RESULT: ${{ needs.c-tests.result }}
          SDIST_RESULT: ${{ needs.build-sdist.result }}
          WHEELS_RESULT: ${{ needs.build-wheels.result }}
        run: |
          echo "Results: $RESULTS"
          if [[ "$VERSION_ONLY" != "true" ]]; then
            if [[ "$C_TESTS" == true && "$C_RESULT" == skipped ]] ||
               [[ "$WHEELS" != '[]' && ( "$SDIST_RESULT" == skipped || "$WHEELS_RESULT" == skipped ) ]]; then
              echo "::error::a planned build job was skipped outside a version-only change"
              exit 1
            fi
          fi
          for r in $RESULTS; do
            if [[ "$r" != success && "$r" != skipped ]]; then
              exit 1
            fi
          done

  publish-release:
    name: Publish verified package release
    needs: [plan, ci-passed]
    if: >-
      !cancelled() &&
      github.repository == 'LedFx/aubio-ledfx' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.plan.result == 'success' && needs.plan.outputs.release == 'true' &&
      needs.ci-passed.result == 'success'
    environment:
      name: pypi
      url: https://pypi.org/p/aubio-ledfx/
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cibw-sdist
          path: dist/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            pyproject.toml
          sparse-checkout-cone-mode: false
          path: release-tools
      - name: Mint scoped publication token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-attestations: write
      - name: Freeze verified distributions and release identity
        id: prepare
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: prepare
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Attest the tested distributions
        id: provenance
        if: steps.prepare.outputs.already_published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
          create-storage-record: false
          github-token: ${{ steps.release-token.outputs.token }}
      - name: Recheck immutable inputs before PyPI upload
        id: upload
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: check-upload
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - name: Stage verified distributions for PyPI
        if: steps.upload.outputs.pypi_upload == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir pypi-dist
          cp -- dist/* pypi-dist/
      - name: Publish matching missing Python distributions
        if: steps.upload.outputs.pypi_upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          skip-existing: true # Both preflights require matching remote SHA-256.
      - name: Verify provenance and finalize existing GitHub draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
        uses: LedFx/release-ci/actions/release@442e00705d4e5edd589021851e756761363f9d84 # v0.3.1
        with:
          phase: finalize
          project: release-tools
          dist: dist
          snapshot: ${{ runner.temp }}/release-snapshot.json
          wheel-plan: ${{ needs.plan.outputs.wheel-plan }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.prepare.outcome == 'success'
        with:
          name: release-provenance-${{ github.ref_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-snapshot.json
            ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
